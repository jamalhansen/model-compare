[project]
name = "model-compare"
version = "0.1.0"
description = "Ask multiple LLM providers the same prompt concurrently via llm-gateway-service and show their answers side by side."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=14.3.3",
    "local-first-common",
    "httpx>=0.28.1",
]

[project.scripts]
model-compare = "model_compare.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_compare"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
